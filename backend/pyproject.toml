[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncviewer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "cryptography>=42",
  "pyjwt[crypto]>=2.8",
  "python-dotenv>=1.0",
  "google-adk>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "pgembed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["B008"]  # FastAPI idiom: Depends()/Query() in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
