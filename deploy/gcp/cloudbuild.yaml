# Builds the three images in parallel on the free default pool; deploy.py passes the substitutions.
steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/syncviewer/backend:${_TAG}", backend]
    waitFor: ["-"]
  - id: generator
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/syncviewer/generator:${_TAG}", generator]
    waitFor: ["-"]
  - id: frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/syncviewer/frontend:${_TAG}"
      - --build-arg
      - "VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}"
      - --build-arg
      - "VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}"
      - --build-arg
      - "VITE_API_URL=${_VITE_API_URL}"
      - --build-arg
      - "VITE_ENABLE_GOOGLE_AUTH=${_VITE_ENABLE_GOOGLE_AUTH}"
      - frontend
    waitFor: ["-"]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/syncviewer/backend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/syncviewer/generator:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/syncviewer/frontend:${_TAG}"
options:
  # build logs go to Cloud Logging only (no storage bucket to pay for)
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
