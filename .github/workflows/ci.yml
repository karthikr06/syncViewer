name: CI
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      # tests start an embedded PostgreSQL (pgembed), so no service container is needed
      - run: uv run pytest -q

  generator:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: generator } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    # push images to Docker Hub from main/tags once everything is green
    needs: [backend, generator, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/syncviewer-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/syncviewer-backend:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./generator
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/syncviewer-generator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/syncviewer-generator:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_ENABLE_GOOGLE_AUTH=${{ vars.VITE_ENABLE_GOOGLE_AUTH || 'false' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/syncviewer-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/syncviewer-frontend:${{ steps.meta.outputs.tag }}
