# Local-only override: runs a throwaway Postgres next to the stack so everything works without a
# Supabase project (login still needs Supabase Auth, or mint test JWTs with SUPABASE_JWT_SECRET).
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: syncviewer
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syncviewer"]
      interval: 2s
      retries: 30
    volumes: [localdb:/var/lib/postgresql/data]

  migrate:
    environment: &local_db
      DATABASE_URL: postgresql://postgres:localdev@db:5432/syncviewer
      MIGRATION_DATABASE_URL: postgresql://postgres:localdev@db:5432/syncviewer
    depends_on: { db: { condition: service_healthy } }

  api:
    environment:
      <<: *local_db
      GENERATOR_URL: http://generator:8100
      # optional: lets you call the API with self-minted HS256 test tokens (never use in production)
      SUPABASE_JWT_SECRET: ${LOCAL_JWT_SECRET:-}

  collector:
    environment:
      <<: *local_db
      GENERATOR_URL: http://generator:8100

volumes:
  localdb:
