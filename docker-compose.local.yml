# Local Postgres instead of Supabase's (login still uses Supabase Auth):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: syncviewer
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syncviewer"]
      interval: 2s
      retries: 30
    volumes: [localdb:/var/lib/postgresql/data]

  migrate:
    environment: &local_db
      DATABASE_URL: postgresql://postgres:localdev@db:5432/syncviewer
      MIGRATION_DATABASE_URL: postgresql://postgres:localdev@db:5432/syncviewer
    depends_on: { db: { condition: service_healthy } }

  api:
    environment:
      <<: *local_db
      GENERATOR_URL: http://generator:8100

  collector:
    environment:
      <<: *local_db
      GENERATOR_URL: http://generator:8100

volumes:
  localdb:
