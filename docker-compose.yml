services:
  generator:
    build: ./generator
    image: syncviewer-generator:local
    env_file: .env
    ports: ["8100:8100"]
    restart: unless-stopped

  # one-shot: applies Alembic migrations to the database in .env, then exits
  migrate:
    build: ./backend
    image: syncviewer-backend:local
    env_file: .env
    command: ["alembic", "upgrade", "head"]

  api:
    image: syncviewer-backend:local
    env_file: .env
    environment:
      GENERATOR_URL: http://generator:8100
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      generator: { condition: service_started }

  collector:
    image: syncviewer-backend:local
    env_file: .env
    environment:
      GENERATOR_URL: http://generator:8100
    command: ["python", "-m", "app.collector.serve"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      generator: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_ENABLE_GOOGLE_AUTH: ${VITE_ENABLE_GOOGLE_AUTH:-false}
    image: syncviewer-frontend:local
    environment:
      # allow the browser to call Supabase (login) and the API
      CSP_CONNECT_SRC: "'self' ${VITE_SUPABASE_URL} ${VITE_API_URL:-http://localhost:8000}"
    ports: ["8080:80"]
    restart: unless-stopped

  # ---- optional local monitoring demo: docker compose --profile monitoring up -d ----
  # Add a Prometheus account at http://localhost:9090 (http://prometheus:9090 from the api
  # container): source node_exporter for job "node", or OpenTelemetry for job "hosts".
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["monitoring"]
    hostname: demo-vm-1
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    profiles: ["monitoring"]
    hostname: demo-vm-2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [prometheus]
    restart: unless-stopped
